<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle border -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#a855f7" stroke-width="4" stroke-opacity="0.3" />

  <!-- Builder Blocks forming a stylized 'B' -->
  <!-- Top Block -->
  <rect x="112" y="112" width="288" height="72" rx="20" fill="url(#primaryGrad)" filter="url(#glow)" />
  <rect x="132" y="132" width="96" height="32" rx="10" fill="#ffffff" fill-opacity="0.25" />
  
  <!-- Middle Block Left -->
  <rect x="112" y="212" width="132" height="88" rx="20" fill="url(#accentGrad)" />
  <circle cx="178" cy="256" r="18" fill="#ffffff" fill-opacity="0.3" />
  
  <!-- Middle Block Right -->
  <rect x="264" y="212" width="136" height="88" rx="20" fill="url(#highlightGrad)" />
  <rect x="288" y="244" width="88" height="24" rx="8" fill="#ffffff" fill-opacity="0.3" />

  <!-- Bottom Block -->
  <rect x="112" y="328" width="288" height="72" rx="20" fill="url(#primaryGrad)" />
  <rect x="136" y="352" width="140" height="24" rx="8" fill="#ffffff" fill-opacity="0.25" />
  <rect x="296" y="352" width="80" height="24" rx="8" fill="#ffffff" fill-opacity="0.4" />
</svg>